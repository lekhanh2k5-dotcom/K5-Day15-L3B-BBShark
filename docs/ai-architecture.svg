<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790" width="1200" height="790" font-family="Segoe UI, Inter, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.07"/>
    </filter>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#E11D48"/>
    </marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7C3AED"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1200" height="790" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Header Bar -->
  <rect x="0" y="0" width="1200" height="84" rx="16" fill="#F8FAFC"/>
  <rect x="0" y="68" width="1200" height="16" fill="#F8FAFC"/>
  <line x1="0" y1="84" x2="1200" y2="84" stroke="#E2E8F0" stroke-width="1.5"/>

  <text x="36" y="38" font-size="19" font-weight="700" fill="#0F172A">KIẾN TRÚC AI — XỬ LÝ KHIẾU NẠI ĐƠN GIAO ĐỒ ĂN (TRACK D1 · BBSHARK)</text>
  <text x="36" y="62" font-size="13" fill="#475569">Workflow cố định · 2 lần gọi Model · Mọi phép tính tiền &amp; hạn mức kiểm bằng Code · Con người giữ chốt an toàn</text>

  <!-- Legend -->
  <g transform="translate(746, 18)" font-size="11.5" font-weight="600">
    <rect x="0" y="0" width="102" height="22" rx="11" fill="#EFF6FF" stroke="#93C5FD"/>
    <text x="51" y="15" text-anchor="middle" fill="#1D4ED8">Khách / Chat</text>

    <rect x="108" y="0" width="114" height="22" rx="11" fill="#FFFBEB" stroke="#FCD34D"/>
    <text x="165" y="15" text-anchor="middle" fill="#B45309">Code Guardrails</text>

    <rect x="228" y="0" width="84" height="22" rx="11" fill="#F5F3FF" stroke="#C4B5FD"/>
    <text x="270" y="15" text-anchor="middle" fill="#6D28D9">AI Model</text>

    <rect x="318" y="0" width="104" height="22" rx="11" fill="#ECFDF5" stroke="#6EE7B7"/>
    <text x="370" y="15" text-anchor="middle" fill="#047857">Người duyệt</text>

    <rect x="108" y="28" width="194" height="22" rx="11" fill="#FFF1F2" stroke="#FDA4AF"/>
    <text x="205" y="43" text-anchor="middle" fill="#BE123C">Chặn sớm / Hỏi lại / Từ chối</text>
  </g>

  <!-- ==================== TIER 1: INTAKE & CLASSIFICATION ==================== -->
  <!-- Box 1: Customer Input -->
  <g filter="url(#shadow)">
    <rect x="36" y="114" width="188" height="122" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.8"/>
    <rect x="48" y="124" width="60" height="19" rx="9" fill="#2563EB"/>
    <text x="78" y="137" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">INPUT</text>
    <text x="130" y="166" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A8A">Khách nhắn</text>
    <text x="130" y="185" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A8A">khiếu nại</text>
    <text x="130" y="207" text-anchor="middle" font-size="11.5" fill="#334155">Trong khung chat app</text>
    <text x="130" y="223" text-anchor="middle" font-size="11" fill="#64748B">(có dấu / không dấu / viết tắt)</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="224" y1="175" x2="262" y2="175" stroke="#475569" stroke-width="2" marker-end="url(#arrow-slate)"/>

  <!-- Box 2: Step 0 Safety & Want Human -->
  <g filter="url(#shadow)">
    <rect x="266" y="106" width="232" height="138" rx="12" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.8"/>
    <rect x="278" y="116" width="136" height="19" rx="9" fill="#D97706"/>
    <text x="346" y="129" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">BƯỚC 0 · CODE GUARD</text>
    <text x="382" y="156" text-anchor="middle" font-size="14" font-weight="700" fill="#92400E">Chặn an toàn &amp; đòi người</text>
    <text x="382" y="177" text-anchor="middle" font-size="12" fill="#451A03">• SAFETY: ngộ độc, đau bụng,</text>
    <text x="382" y="194" text-anchor="middle" font-size="12" fill="#451A03">  dị ứng, dị vật (có/không dấu)</text>
    <text x="382" y="213" text-anchor="middle" font-size="12" fill="#451A03">• WANT_HUMAN: đòi gặp nhân viên</text>
    <text x="382" y="232" text-anchor="middle" font-size="11" font-style="italic" fill="#B45309">Chạy TRƯỚC khi gọi AI</text>
  </g>

  <!-- Branch 2 Down: Escalate immediately -->
  <line x1="382" y1="244" x2="382" y2="278" stroke="#E11D48" stroke-width="2" marker-end="url(#arrow-rose)"/>
  <rect x="390" y="250" width="32" height="18" rx="4" fill="#FFF1F2"/>
  <text x="406" y="263" text-anchor="middle" font-size="11" font-weight="700" fill="#BE123C">Có</text>

  <g filter="url(#shadow)">
    <rect x="266" y="282" width="232" height="68" rx="10" fill="#FFF1F2" stroke="#FB7185" stroke-width="1.6"/>
    <text x="382" y="305" text-anchor="middle" font-size="12.5" font-weight="700" fill="#9F1239">escalate_to_human()</text>
    <text x="382" y="324" text-anchor="middle" font-size="12" fill="#881337">Chuyển nhân viên ngay (0đ)</text>
    <text x="382" y="341" text-anchor="middle" font-size="11" font-weight="600" fill="#BE123C">[quyet_dinh: chuyen_nguoi · 0đ]</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="498" y1="175" x2="544" y2="175" stroke="#475569" stroke-width="2" marker-end="url(#arrow-slate)"/>
  <text x="521" y="167" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">Không</text>

  <!-- Box 3: Step 1-2 Order Lookup -->
  <g filter="url(#shadow)">
    <rect x="548" y="106" width="222" height="138" rx="12" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.8"/>
    <rect x="560" y="116" width="144" height="19" rx="9" fill="#D97706"/>
    <text x="632" y="129" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">BƯỚC 1–2 · CODE + TOOL</text>
    <text x="659" y="156" text-anchor="middle" font-size="14" font-weight="700" fill="#92400E">Tách mã đơn &amp; Tra đơn</text>
    <text x="659" y="178" text-anchor="middle" font-size="12" fill="#451A03">• Regex mã đơn (#A101)</text>
    <text x="659" y="197" text-anchor="middle" font-size="12" fill="#451A03">• Tool: get_order(oid)</text>
    <text x="659" y="216" text-anchor="middle" font-size="12" fill="#451A03">• Lấy danh sách món &amp; giờ giao</text>
    <text x="659" y="233" text-anchor="middle" font-size="11" fill="#B45309">Không trả SĐT / địa chỉ</text>
  </g>

  <!-- Branch 3 Down: Missing / Not Found -->
  <line x1="659" y1="244" x2="659" y2="278" stroke="#E11D48" stroke-width="2" marker-end="url(#arrow-rose)"/>
  <rect x="667" y="250" width="96" height="18" rx="4" fill="#FFF1F2"/>
  <text x="715" y="263" text-anchor="middle" font-size="11" font-weight="700" fill="#BE123C">Thiếu / Không thấy</text>

  <g filter="url(#shadow)">
    <rect x="548" y="282" width="222" height="68" rx="10" fill="#FFF1F2" stroke="#FB7185" stroke-width="1.6"/>
    <text x="659" y="305" text-anchor="middle" font-size="12.5" font-weight="700" fill="#9F1239">Hỏi lại mã đơn (G10)</text>
    <text x="659" y="324" text-anchor="middle" font-size="12" fill="#881337">Không tự đoán đơn hay tiền</text>
    <text x="659" y="341" text-anchor="middle" font-size="11" font-weight="600" fill="#BE123C">[quyet_dinh: hoi_lai · 0đ]</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line x1="770" y1="175" x2="824" y2="175" stroke="#475569" stroke-width="2" marker-end="url(#arrow-slate)"/>
  <text x="797" y="167" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">Có đơn</text>

  <!-- Box 4: Step 3 Model 1 Classify -->
  <g filter="url(#shadow)">
    <rect x="828" y="106" width="336" height="138" rx="12" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="1.8"/>
    <rect x="840" y="116" width="178" height="19" rx="9" fill="#7C3AED"/>
    <text x="929" y="129" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">BƯỚC 3 · MODEL LẦN 1 (AI)</text>
    <text x="996" y="156" text-anchor="middle" font-size="14" font-weight="700" fill="#4C1D95">Hiểu tin nhắn &amp; Phân loại JSON</text>
    <text x="996" y="177" text-anchor="middle" font-size="12" fill="#2E1065">issue: thieu_mon | sai_mon | giao_tre | khac | chua_ro</text>
    <text x="996" y="196" text-anchor="middle" font-size="12" fill="#2E1065">items: [danh sách món khách nêu] · ask: câu hỏi lại</text>
    <text x="996" y="216" text-anchor="middle" font-size="11.5" font-weight="600" fill="#6D28D9">• Tin nhắn là DỮ LIỆU, bỏ qua lệnh chèn / lời doạ 1★</text>
    <text x="996" y="233" text-anchor="middle" font-size="11" fill="#5B21B6">• Model KHÔNG tính tiền, KHÔNG chọn mức bồi thường</text>
  </g>

  <!-- Branch 4 Down-Left: chua_ro / khac -->
  <line x1="912" y1="244" x2="912" y2="278" stroke="#E11D48" stroke-width="2" marker-end="url(#arrow-rose)"/>
  <rect x="826" y="250" width="80" height="18" rx="4" fill="#FFF1F2"/>
  <text x="866" y="263" text-anchor="middle" font-size="11" font-weight="700" fill="#BE123C">chua_ro / khac</text>

  <g filter="url(#shadow)">
    <rect x="828" y="282" width="192" height="68" rx="10" fill="#FFF1F2" stroke="#FB7185" stroke-width="1.6"/>
    <text x="924" y="305" text-anchor="middle" font-size="12.5" font-weight="700" fill="#9F1239">Hỏi lại 1 câu / Từ chối</text>
    <text x="924" y="324" text-anchor="middle" font-size="11.5" fill="#881337">G10 hoặc ngoài phạm vi</text>
    <text x="924" y="341" text-anchor="middle" font-size="11" font-weight="600" fill="#BE123C">hoi_lai / tu_choi · 0đ</text>
  </g>

  <!-- Main Connector Tier 1 -> Tier 2 -->
  <path d="M 1094 244 L 1094 374 L 152 374 L 152 402" fill="none" stroke="#7C3AED" stroke-width="2.2" marker-end="url(#arrow-violet)"/>
  <rect x="1030" y="250" width="132" height="18" rx="4" fill="#F5F3FF"/>
  <text x="1096" y="263" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6D28D9">thieu / sai / giao_tre</text>

  <!-- ==================== TIER 2: POLICY CODE -> MODEL 2 -> HUMAN CONFIRM ==================== -->
  <!-- Box 5: Step 4a History & Status -->
  <g filter="url(#shadow)">
    <rect x="36" y="406" width="232" height="142" rx="12" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.8"/>
    <rect x="48" y="416" width="144" height="19" rx="9" fill="#D97706"/>
    <text x="120" y="429" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">BƯỚC 4A · CODE + TOOL</text>
    <text x="152" y="456" text-anchor="middle" font-size="14" font-weight="700" fill="#92400E">Kiểm lịch sử &amp; trạng thái</text>
    <text x="152" y="478" text-anchor="middle" font-size="12" fill="#451A03">• get_complaint_history(30 ngày)</text>
    <text x="152" y="497" text-anchor="middle" font-size="11.5" font-weight="600" fill="#BE123C">  ≥ 3 lần → escalate_to_human</text>
    <text x="152" y="517" text-anchor="middle" font-size="12" fill="#451A03">• Đơn đang giao (chưa da_giao)</text>
    <text x="152" y="535" text-anchor="middle" font-size="11.5" font-weight="600" fill="#BE123C">  → chua_giao (0đ)</text>
  </g>

  <!-- Arrow 5 -> 6 -->
  <line x1="268" y1="477" x2="312" y2="477" stroke="#475569" stroke-width="2" marker-end="url(#arrow-slate)"/>
  <text x="290" y="469" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">Hợp lệ</text>

  <!-- Box 6: Step 4b Compute Remedy & Check Limit -->
  <g filter="url(#shadow)">
    <rect x="316" y="406" width="256" height="142" rx="12" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.8"/>
    <rect x="328" y="416" width="156" height="19" rx="9" fill="#D97706"/>
    <text x="406" y="429" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">BƯỚC 4B · CODE TÍNH TIỀN</text>
    <text x="444" y="456" text-anchor="middle" font-size="14" font-weight="700" fill="#92400E">compute_remedy &amp; check_limit</text>
    <text x="444" y="477" text-anchor="middle" font-size="12" fill="#451A03">• Thiếu/sai: cộng đúng giá món trong đơn</text>
    <text x="444" y="496" text-anchor="middle" font-size="12" fill="#451A03">• Trễ &gt; 30p: voucher 50k · ≤ 30p: xin_loi</text>
    <text x="444" y="516" text-anchor="middle" font-size="11.5" font-weight="600" fill="#BE123C">• Món không có trong đơn → tu_choi</text>
    <text x="444" y="535" text-anchor="middle" font-size="11.5" font-weight="600" fill="#BE123C">• Vượt 200.000đ → chuyen_nguoi</text>
  </g>

  <!-- Arrow 6 -> 7 -->
  <line x1="572" y1="477" x2="616" y2="477" stroke="#475569" stroke-width="2" marker-end="url(#arrow-slate)"/>
  <text x="594" y="469" text-anchor="middle" font-size="10.5" font-weight="600" fill="#475569">≤ 200k</text>

  <!-- Box 7: Step 5 Propose Refund + Model 2 + Output Guard -->
  <g filter="url(#shadow)">
    <rect x="620" y="406" width="256" height="142" rx="12" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="1.8"/>
    <rect x="632" y="416" width="186" height="19" rx="9" fill="#7C3AED"/>
    <text x="725" y="429" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">BƯỚC 5 · MODEL LẦN 2 + GUARD</text>
    <text x="748" y="456" text-anchor="middle" font-size="14" font-weight="700" fill="#4C1D95">Tạo bản nháp &amp; Soạn lời nhắn</text>
    <text x="748" y="477" text-anchor="middle" font-size="12" fill="#2E1065">• Tool: propose_refund (chưa chuyển tiền)</text>
    <text x="748" y="496" text-anchor="middle" font-size="12" fill="#2E1065">• Model viết phản hồi lịch sự (2–4 câu)</text>
    <text x="748" y="516" text-anchor="middle" font-size="11.5" font-weight="700" fill="#B45309">• Guard _reply_ok(): kiểm số tiền trong câu</text>
    <text x="748" y="535" text-anchor="middle" font-size="11" fill="#5B21B6">  Nếu model nêu số tiền khác → thay bằng bản mẫu</text>
  </g>

  <!-- Arrow 7 -> 8 -->
  <line x1="876" y1="477" x2="914" y2="477" stroke="#059669" stroke-width="2.2" marker-end="url(#arrow-emerald)"/>

  <!-- Box 8: Output & Human Confirmation -->
  <g filter="url(#shadow)">
    <rect x="918" y="406" width="246" height="142" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="1.8"/>
    <rect x="930" y="416" width="164" height="19" rx="9" fill="#059669"/>
    <text x="1012" y="429" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">OUTPUT · CHỐT CON NGƯỜI</text>
    <text x="1041" y="456" text-anchor="middle" font-size="14" font-weight="700" fill="#065F46">Gửi khách + [quyet_dinh]</text>
    <text x="1041" y="477" text-anchor="middle" font-size="12" fill="#064E3B">• hoan_tien / voucher / xin_loi</text>
    <text x="1041" y="497" text-anchor="middle" font-size="12" font-weight="700" fill="#047857">• Khách bấm Xác nhận mới hoàn</text>
    <text x="1041" y="517" text-anchor="middle" font-size="12" fill="#064E3B">• Đóng khiếu nại: Nhân viên duyệt</text>
    <text x="1041" y="536" text-anchor="middle" font-size="11" font-weight="600" fill="#059669">[quyet_dinh: &lt;hành động&gt; · &lt;tiền&gt;đ]</text>
  </g>

  <!-- ==================== TIER 3: DATA, TOOLS & OBSERVABILITY ==================== -->
  <rect x="36" y="584" width="1128" height="178" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="56" y="608" font-size="12.5" font-weight="700" fill="#334155">TẦNG NỀN TẢNG — DỮ LIỆU, 7 CÔNG CỤ @tool &amp; GIÁM SÁT / ĐÁNH GIÁ</text>

  <!-- Card A: Data -->
  <g filter="url(#shadow)">
    <rect x="56" y="622" width="346" height="122" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.3"/>
    <text x="72" y="646" font-size="13" font-weight="700" fill="#0F172A">1. Dữ liệu nền (data/mock/ · synthetic)</text>
    <text x="72" y="668" font-size="11.8" fill="#334155">• orders.json: 30 đơn A101–A130 (không SĐT/địa chỉ)</text>
    <text x="72" y="688" font-size="11.8" fill="#334155">• policy.json: hạn mức 200k, trễ &gt; 30p → voucher 50k</text>
    <text x="72" y="708" font-size="11.8" fill="#334155">• complaints.json: lịch sử khiếu nại 30 ngày</text>
    <text x="72" y="729" font-size="11" fill="#64748B">Nguồn sự thật duy nhất (seed=15, make_mock_data.py)</text>
  </g>

  <!-- Card B: 7 Tools -->
  <g filter="url(#shadow)">
    <rect x="422" y="622" width="356" height="122" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.3"/>
    <text x="438" y="646" font-size="13" font-weight="700" fill="#0F172A">2. Bảy công cụ @tool (codebase/tools.py)</text>
    <text x="438" y="668" font-size="11.8" fill="#334155">• Tra cứu: get_order · get_policy · get_complaint_history</text>
    <text x="438" y="688" font-size="11.8" fill="#334155">• Tính &amp; kiểm bằng code: compute_remedy · check_limit</text>
    <text x="438" y="708" font-size="11.8" fill="#334155">• Bản nháp (an toàn): propose_refund · escalate_to_human</text>
    <text x="438" y="729" font-size="11" fill="#64748B">Mọi lần gọi công cụ tự động ghi vết vào traces/</text>
  </g>

  <!-- Card C: Model & Eval -->
  <g filter="url(#shadow)">
    <rect x="798" y="622" width="346" height="122" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.3"/>
    <text x="814" y="646" font-size="13" font-weight="700" fill="#0F172A">3. Kết nối Model &amp; Đánh giá (ai.py · eval/)</text>
    <text x="814" y="668" font-size="11.8" fill="#334155">• call_model(): Gemini / OpenRouter / OpenAI / Groq</text>
    <text x="814" y="688" font-size="11.8" fill="#334155">• temperature=0 · đo token thật từ usage API</text>
    <text x="814" y="708" font-size="11.8" fill="#334155">• eval/grade.py chấm code 4 metric trên [quyet_dinh]</text>
    <text x="814" y="729" font-size="11" fill="#64748B">cost/simulate.py đo chi phí thực tế theo persona</text>
  </g>
</svg>
